[package]
name = "hyper_vault"
version = "1.2.0"
edition = "2021"
description = "A production-ready SQL database implementation in Rust featuring ACID transactions, multi-threaded concurrency control, write-ahead logging (WAL) for crash recovery, and advanced SQL operations including JOINs, aggregates, GROUP BY, ORDER BY, and pagination"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/hyper_vault"
keywords = ["database", "sql", "rust", "transaction", "wal", "concurrency"]
categories = ["database"]

[dependencies]
bincode = "1.3.3"
nom = "7.1.3"
serde = { version = "1.0.210", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4"] }